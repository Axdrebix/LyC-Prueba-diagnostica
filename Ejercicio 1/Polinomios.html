<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Polinomios con Descarga</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
            background-color: #f0f2f5;
        }

        .container {
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: auto;
        }

        h2 {
            color: #1a2a3a;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .input-group {
            margin: 15px 0;
        }

        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100px;
        }

        .btn-primario {
            padding: 12px 25px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primario:hover {
            background: #27ae60;
        }

        .btn-descarga {
            padding: 12px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            margin-left: 10px;
            transition: 0.3s;
        }

        .btn-descarga:hover {
            background: #2980b9;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #fafafa;
            border: 1px solid #eee;
            min-height: 50px;
        }

        .paso {
            font-family: monospace;
            font-size: 0.9em;
            background: #fff;
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.02);
        }

        .tiempo-box {
            margin-top: 15px;
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            color: #856404;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Generador de Polinomio (x+1)ⁿ</h2>

        <div class="input-group">
            <label>Grado (n):</label>
            <input type="number" id="gradoN" value="4" min="0">
        </div>

        <div class="input-group">
            <label>Valor de x:</label>
            <input type="number" id="valorX" value="2">
        </div>

        <button class="btn-primario" onclick="ejecutarCalculo()">Calcular Polinomio</button>
        <button id="btnDescargar" class="btn-descarga" onclick="generarArchivo()">Descargar Reporte .txt</button>

        <div id="resultado">
            <p style="color: #888;">Introduce los valores para comenzar...</p>
        </div>
    </div>

    <script>
        let contenidoTxt = ""; // Variable global para guardar lo que irá al archivo

        function generarCoeficientes(n) {
            let coefs = new Array(n + 1).fill(0);
            coefs[0] = 1;
            for (let i = 1; i <= n; i++) {
                for (let j = i; j > 0; j--) {
                    coefs[j] = coefs[j] + coefs[j - 1];
                }
            }
            return coefs;
        }

        function ejecutarCalculo() {
            const n = parseInt(document.getElementById('gradoN').value);
            const x = parseFloat(document.getElementById('valorX').value);
            const divRes = document.getElementById('resultado');

            // 1. Generar Polinomio
            const coefs = generarCoeficientes(n);
            let terminos = [];
            for (let i = 0; i <= n; i++) {
                let potencia = n - i;
                let t = coefs[i].toString();
                if (potencia > 0) t += `x<sup>${potencia}</sup>`;
                terminos.push(t);
            }

            let htmlFinal = `<strong>Polinomio Generado:</strong><br>${terminos.join(" + ")}<hr>`;

            // 2. Cálculo paso a paso
            let sumaTotal = 0;
            htmlFinal += "<strong>Pasos del cálculo:</strong>";
            for (let i = 0; i <= n; i++) {
                let potencia = n - i;
                let valorPot = Math.pow(x, potencia);
                let valorTermino = coefs[i] * valorPot;
                sumaTotal += valorTermino;
                htmlFinal += `<div class="paso">Paso ${i + 1}: Coeficiente ${coefs[i]} * (${x}^${potencia}) = ${valorTermino}</div>`;
            }
            htmlFinal += `<p><strong>Resultado Final f(${x}) = ${sumaTotal}</strong></p>`;

            // 3. Prueba de rendimiento n=100
            const tStart = performance.now();
            generarCoeficientes(100);
            const tEnd = performance.now();
            const tiempoMs = (tEnd - tStart).toFixed(6);

            // Preparar contenido para el archivo .txt
            contenidoTxt = `RESULTADOS DEL POLINOMIO (x+1)^n\n`;
            contenidoTxt += `----------------------------------\n`;
            contenidoTxt += `Grado n: ${n}\n`;
            contenidoTxt += `Valor x: ${x}\n`;
            contenidoTxt += `Resultado f(x): ${sumaTotal}\n`;
            contenidoTxt += `----------------------------------\n`;
            contenidoTxt += `PRUEBA DE RENDIMIENTO (n=100)\n`;
            contenidoTxt += `JavaScript | Tiempo de ejecucion: ${tiempoMs} milisegundos.\n`;

            // Mostrar en pantalla y activar botón de descarga
            divRes.innerHTML = htmlFinal + `<div class="tiempo-box">⏱️ ${tiempoMs} ms para n=100 (Registrado para el .txt)</div>`;
            document.getElementById('btnDescargar').style.display = "inline-block";
        }

        function generarArchivo() {
            const blob = new Blob([contenidoTxt], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tiempos_ejecucion_html.txt';
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>

</body>

</html>
